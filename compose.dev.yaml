# Development override: run it together with the base file.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# The backend reloads from the mounted source, the frontend runs the Vite dev
# server, and PostgreSQL keeps its own volume so development data never touches
# the database the base stack uses.
services:
  postgres:
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  backend:
    command:
      - sh
      - -c
      - >-
        alembic -c /app/backend/alembic.ini upgrade head &&
        uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
        --reload --reload-dir /app/backend
    volumes:
      - ./backend:/app/backend

  frontend:
    # The built Nginx image is replaced by the Node image running Vite.
    build: !reset
    image: node:22-slim
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # The dev server is the single origin; it proxies `/api` to the backend.
      VITE_API_BASE_URL: http://localhost:${WEB_DEV_PORT:-5173}
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${WEB_DEV_PORT:-5173}:5173"
    # The image healthcheck probes the Nginx port, which Vite does not serve.
    healthcheck: !reset

volumes:
  postgres_dev_data:
  frontend_node_modules:
