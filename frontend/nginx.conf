# Nginx configuration for the built SPA.
#
# The API sends no CORS headers, so the browser and the API share one origin:
# Nginx serves the static bundle and forwards every `/api` call to the backend
# service on the Compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward the request unchanged, so `/api/v1/...` reaches the backend as is.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health and readiness answer from the public origin too. Without this they
    # would fall through to the SPA and report 200 while the database is down,
    # which is a false positive for any probe reading this entry point.
    location ~ ^/(health|ready)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable; the entry point below is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
