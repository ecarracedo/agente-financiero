# Nginx configuration for the built SPA.
#
# The API sends no CORS headers, so the browser and the API share one origin:
# Nginx serves the static bundle and forwards every `/api` call to the backend
# service on the Compose network.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. A literal upstream name is resolved once at startup
    # and cached forever, so a backend recreated with a new address would keep
    # answering 502 until this container restarted. Resolving through a variable
    # makes Nginx re-resolve, bounded by the record's TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The upstream is a variable so the name above is resolved per request
    # rather than once at startup.
    set $backend_upstream backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Forward the request unchanged, so `/api/v1/...` reaches the backend as is.
    #
    # Health and readiness answer from the public origin too. Without them they
    # would fall through to the SPA and report 200 while the database is down,
    # which is a false positive for any probe reading this entry point. Both
    # share one block so the proxy headers below cannot drift apart.
    location ~ ^/(api/|health$|ready$) {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable; the entry point below is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
