[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-backend"
version = "0.1.0"
description = "Backend API for the financial agent platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "strands-agents>=1.61,<2",
    "uvicorn[standard]>=0.34,<1",
    "yfinance>=0.2.66,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.setuptools]
package-dir = {"backend" = "."}
packages = [
    "backend",
    "backend.app",
    "backend.app.domain",
    "backend.app.application",
    "backend.app.api",
    "backend.app.agents",
    "backend.app.adapters",
    "backend.app.adapters.migration",
    "backend.app.adapters.persistence",
]
